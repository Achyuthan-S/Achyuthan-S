name: Refresh terminal panes

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays 06:17 UTC
  workflow_dispatch:             # manual run from the Actions tab
  push:
    paths:
      - "scripts/config.json"    # re-render when the curation list changes
      - "scripts/render_panes.py"

permissions:
  contents: write

concurrency:
  group: refresh-terminal
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch merged upstream PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_data.py

      - name: Render panes
        run: python scripts/render_panes.py assets

      - name: Verify SVGs are well-formed
        run: |
          python - <<'PY'
          import glob, sys, xml.dom.minidom as m
          files = [f for n in ("term", "neofetch", "upstream")
                   for f in sorted(glob.glob(f"assets/{n}-*.svg"))]
          assert len(files) == 6, f"expected 6 panes, found {len(files)}: {files}"
          for f in files:
              m.parse(f)          # raises on malformed XML
              if "<animate" not in open(f).read():
                  sys.exit(f"{f} lost its animation")
          print(f"verified {len(files)} panes")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets scripts/data.json; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git add assets scripts/data.json
          git commit -m "chore: refresh terminal panes from upstream PR data"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="macOS Terminal">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#2b2b2b"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="0" y="0" width="900" height="280" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="900" height="280" fill="#1c1c1c"/>
    <rect width="900" height="36" fill="url(#titlebar)"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#000" stroke-opacity="0.45"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="450" y="22" text-anchor="middle" fill="#d0d0d0" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">achyuthan@nyu - zsh - 120x32</text>
    <rect y="36" width="900" height="244" fill="#0c0c0c"/>
    <g font-family="Menlo, Monaco, Courier New, monospace" font-size="13.5">
      <text x="18" y="64"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan><tspan fill="#f5f5f5">whoami</tspan></text>
      <text x="18" y="86" fill="#e8e8e8">Achyuthan Sivasankar | Research Assistant | Prof. Anna Choromanska's Lab, NYU</text>
      <text x="18" y="118"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan><tspan fill="#f5f5f5">cat FOCUS.md</tspan></text>
      <text x="18" y="140" fill="#c8c8c8">I work on one problem: how sparse neural systems learn to route</text>
      <text x="18" y="160" fill="#c8c8c8">computation - and when routing actually helps.</text>
      <text x="18" y="188" fill="#c8c8c8">Currently: self-supervised world models for autonomous driving with LiDAR.</text>
      <text x="18" y="228"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan></text>
      <rect x="248" y="215" width="8" height="16" fill="#28c840">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="279" rx="10" ry="10" fill="none" stroke="#000" stroke-opacity="0.55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Terminal: Achyuthan Sivasankar — sparse neural routing, world models, LiDAR at NYU">
  <defs>
    <clipPath id="win-dark"><rect x="0" y="0" width="900" height="320" rx="14" ry="14"/></clipPath>
  </defs>
  <g clip-path="url(#win-dark)">
    <rect width="900" height="320" fill="#161b22"/>
    <rect width="900" height="46" fill="#21262d"/>
    <rect width="900" height="1" fill="#ffffff" opacity="0.05"/>
    <line x1="0" y1="46" x2="900" y2="46" stroke="#30363d"/>
    <circle cx="26" cy="23" r="6.5" fill="#ff5f56"/>
    <circle cx="48" cy="23" r="6.5" fill="#febc2e"/>
    <circle cx="70" cy="23" r="6.5" fill="#27c93f"/>
    <text x="450" y="28" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500">achyuthan@nyu — zsh</text>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
      <!-- whoami -->
      <text x="30" y="92" fill="#58a6ff">~/lab</text>
      <path d="M82,81 L90,87 L82,93" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="92" fill="#e6edf3">whoami</text>
      <text x="30" y="122" fill="#f0f6fc" font-weight="600">Achyuthan Sivasankar</text>
      <!-- cat focus.txt -->
      <text x="30" y="162" fill="#58a6ff">~/lab</text>
      <path d="M82,151 L90,157 L82,163" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="162" fill="#e6edf3">cat focus.txt</text>
      <rect x="30" y="183" width="7" height="7" rx="1.5" fill="#3fb950"/>
      <text x="46" y="192" fill="#adbac7">sparse neural routing — when routing actually helps</text>
      <rect x="30" y="211" width="7" height="7" rx="1.5" fill="#3fb950"/>
      <text x="46" y="220" fill="#adbac7">self-supervised world models · LiDAR</text>
      <rect x="30" y="239" width="7" height="7" rx="1.5" fill="#3fb950"/>
      <text x="46" y="248" fill="#adbac7">research assistant · Choromanska Lab, NYU</text>
      <!-- git log -->
      <text x="30" y="288" fill="#58a6ff">~/lab</text>
      <path d="M82,277 L90,283 L82,289" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="288" fill="#e6edf3">git log --merged --upstream --oneline</text>
      <rect x="440" y="276" width="8" height="15" rx="2" fill="#3fb950">
        <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" ry="14" fill="none" stroke="#30363d"/>
</svg>

      <text x="18" y="300"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan><tspan fill="#f5f5f5">echo $INTERESTS</tspan></text>
      <text x="18" y="322" fill="#c8c8c8">self-supervised learning | sparse MoE | neural routing | world models | LiDAR</text>
      <text x="18" y="352"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan><tspan fill="#f5f5f5">echo $STACK</tspan></text>

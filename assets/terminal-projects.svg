    <rect y="36" width="900" height="364" fill="#0c0c0c"/>
    <g font-family="Menlo, Monaco, Courier New, monospace" font-size="13.5">
      <text x="18" y="64"><tspan fill="#28c840">achyuthan@nyu</tspan><tspan fill="#d0d0d0">:</tspan><tspan fill="#5ac8fa">~/lab</tspan><tspan fill="#d0d0d0"> % </tspan><tspan fill="#f5f5f5">ls projects/</tspan></text>
      <text x="18" y="86"><tspan fill="#5ac8fa">AD-LiST-JEPA/</tspan><tspan fill="#5ac8fa" dx="28">KAN-Multi/</tspan><tspan fill="#5ac8fa" dx="28">MoE-Bench/</tspan></text>
